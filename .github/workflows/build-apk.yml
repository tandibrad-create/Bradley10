name: Build Flutter APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: ZimRideGuru-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: List build outputs
        if: always()
        run: |
          echo "Build output directory contents:"
          find build -type f -name "*.apk" 2>/dev/null || echo "No APK files found"

      - name: Check APK size
        if: success()
        run: |
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "APK Size: $APK_SIZE"

      - name: Create Release Notes
        if: success()
        run: |
          echo "ZimRideGuru APK Build Successful!" > release_notes.txt
          echo "Build Date: $(date)" >> release_notes.txt
          echo "Flutter Version: $(flutter --version)" >> release_notes.txt

      - name: Upload Release Notes
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: Build-Info
          path: release_notes.txt
          retention-days: 30
